name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Run JVM tests
        run: ./gradlew :shared:domain:jvmTest :shared:data:jvmTest

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-sing-box-${{ hashFiles('sing-box-build/build-android.sh') }}
          restore-keys: ${{ runner.os }}-go-sing-box-

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build SingBoxCore AAR
        run: bash sing-box-build/build-android.sh

      - name: Detect Android signing configuration
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && \
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Android signing keystore
        if: steps.android_signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.android_signing.outputs.configured == 'true'
        env:
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Build debug APK fallback
        if: steps.android_signing.outputs.configured == 'false'
        env:
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :androidApp:assembleDebug

      - name: Prepare Android release asset
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          if [ "${{ steps.android_signing.outputs.configured }}" = "true" ]; then
            APK_PATH=$(find androidApp/build/outputs/apk/release -name "*-release.apk" ! -name "*unsigned*" | head -1)
            cp "$APK_PATH" "$RUNNER_TEMP/release-assets/ultra-client-${{ github.ref_name }}-android-release.apk"
          else
            APK_PATH=$(find androidApp/build/outputs/apk/debug -name "*-debug.apk" | head -1)
            cp "$APK_PATH" "$RUNNER_TEMP/release-assets/ultra-client-${{ github.ref_name }}-android-debug.apk"
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets/*.apk
          if-no-files-found: error

      - name: Upload Android to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release-assets/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

  ios:
    name: iOS
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build SharedPresentation XCFramework
        run: ./gradlew :shared:presentation:assembleSharedPresentationXCFramework

      - name: Package iOS XCFramework
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          ditto -c -k --sequesterRsrc --keepParent \
            shared/presentation/build/XCFrameworks/release/SharedPresentation.xcframework \
            "$RUNNER_TEMP/release-assets/ultra-client-${{ github.ref_name }}-ios-shared-xcframework.zip"

      - name: Detect Xcode project
        id: xcode
        run: |
          if [ -d iosApp/iosApp.xcodeproj ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy XCFramework into Xcode project
        if: steps.xcode.outputs.present == 'true'
        run: |
          mkdir -p iosApp/Frameworks
          cp -R shared/presentation/build/XCFrameworks/release/SharedPresentation.xcframework \
               iosApp/Frameworks/SharedPresentation.xcframework

      - name: Build iOS simulator app
        if: steps.xcode.outputs.present == 'true'
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/derivedData"
          APP_PATH=$(find "$RUNNER_TEMP/derivedData" -name "iosApp.app" | head -1)
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$RUNNER_TEMP/release-assets/ultra-client-${{ github.ref_name }}-ios-simulator-app.zip"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

      - name: Upload iOS to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            singbox: sing-box
          - name: macOS
            os: macos-latest
            singbox: sing-box
          - name: Windows
            os: windows-latest
            singbox: sing-box.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Build desktop app jar
        shell: bash
        run: ./gradlew :desktopApp:packageUberJarForCurrentOS

      - name: Build sing-box desktop binary
        shell: bash
        run: bash sing-box-build/build-desktop.sh

      - name: Compile macOS LaunchDaemon helper
        if: matrix.name == 'macOS'
        run: swiftc desktop-helper/macos/UltraVpnHelper.swift -o desktop-helper/macos/ultra-vpn-helper

      - name: Prepare desktop release assets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp desktopApp/build/compose/jars/*.jar \
            "$RUNNER_TEMP/release-assets/ultra-client-${{ github.ref_name }}-desktop-${{ matrix.name }}.jar"
          cp "sing-box-build/output/desktop/${{ matrix.singbox }}" \
            "$RUNNER_TEMP/release-assets/${{ matrix.singbox }}"
          if [ "${{ matrix.name }}" = "macOS" ]; then
            cp desktop-helper/macos/ultra-vpn-helper "$RUNNER_TEMP/release-assets/ultra-vpn-helper"
          fi
          cd "$RUNNER_TEMP/release-assets"
          zip -r "ultra-client-${{ github.ref_name }}-desktop-${{ matrix.name }}.zip" .
          find . -type f ! -name "*.zip" -delete

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets/*.zip
          if-no-files-found: error

      - name: Upload desktop to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release-assets/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
