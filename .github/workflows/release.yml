name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  # ─── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Run domain tests
        run: ./gradlew :shared:domain:jvmTest

      - name: Run data tests
        run: ./gradlew :shared:data:jvmTest

  # ─── Android APK ─────────────────────────────────────────────────────────────
  android:
    name: Android Installable APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-sing-box-${{ hashFiles('sing-box-build/build-android.sh') }}
          restore-keys: ${{ runner.os }}-go-sing-box-

      - name: Install Android NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"

      - name: Build SingBoxCore AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: bash sing-box-build/build-android.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Detect Android signing configuration
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && \
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Android signing keystore
        if: steps.android_signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.android_signing.outputs.configured == 'true'
        env:
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Build debug APK fallback
        if: steps.android_signing.outputs.configured == 'false'
        env:
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :androidApp:assembleDebug

      - name: Prepare Android release asset
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          if [ "${{ steps.android_signing.outputs.configured }}" = "true" ]; then
            APK_PATH=$(find androidApp/build/outputs/apk/release -name "*-release.apk" ! -name "*unsigned*" | head -1)
            test -n "$APK_PATH"
            cp "$APK_PATH" "$RUNNER_TEMP/release-assets/ultra-client-${{ github.ref_name }}-android-release.apk"
          else
            APK_PATH=$(find androidApp/build/outputs/apk/debug -name "*-debug.apk" | head -1)
            test -n "$APK_PATH"
            cp "$APK_PATH" "$RUNNER_TEMP/release-assets/ultra-client-${{ github.ref_name }}-android-debug.apk"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets/*.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release-assets/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ─── iOS IPA ─────────────────────────────────────────────────────────────────
  ios:
    name: iOS IPA
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build SharedPresentation XCFramework
        run: ./gradlew :shared:presentation:assembleSharedPresentationXCFramework

      - name: Copy XCFramework into Xcode project
        run: |
          mkdir -p iosApp/Frameworks
          cp -R shared/presentation/build/XCFrameworks/release/SharedPresentation.xcframework \
               iosApp/Frameworks/SharedPresentation.xcframework

      # secrets context is unavailable in if: expressions; read it via env and
      # write a plain flag to GITHUB_OUTPUT instead.
      - name: Detect signing configuration
        id: signing
        env:
          CERT: ${{ secrets.IOS_CERT_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Unsigned path: build for simulator + package as IPA-compatible zip ──────
      - name: Build for simulator (unsigned)
        if: steps.signing.outputs.configured == 'false'
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath $RUNNER_TEMP/derivedData

      - name: Package simulator app
        if: steps.signing.outputs.configured == 'false'
        run: |
          APP_PATH=$(find $RUNNER_TEMP/derivedData -name "iosApp.app" | head -1)
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -R "$APP_PATH" $RUNNER_TEMP/ipa/Payload/
          cd $RUNNER_TEMP/ipa && zip -r iosApp-simulator.ipa Payload

      # ── Signed path: archive + export real IPA for device ────────────────────
      - name: Import signing certificate
        if: steps.signing.outputs.configured == 'true'
        env:
          IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$IOS_CERT_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archive (signed)
        if: steps.signing.outputs.configured == 'true'
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -archivePath $RUNNER_TEMP/ultra.xcarchive

      - name: Export IPA (signed)
        if: steps.signing.outputs.configured == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/ultra.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist iosApp/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.ref_name }}
          path: ${{ runner.temp }}/ipa/
          if-no-files-found: error
